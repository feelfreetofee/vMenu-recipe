on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - run: |
          sed -i "s|https://github.com/TomGrobbe/vMenu/releases/download/.*|$(curl -s https://api.github.com/repos/TomGrobbe/vMenu/releases/latest | jq -r '.assets[0].browser_download_url')|" recipe.yaml
          if ! git diff --quiet recipe.yaml
          then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add recipe.yaml
            git commit -m "chore: Update vMenu"
            git push
          fi